name: Daily Data and Model Update

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Both scripts use relative paths (data/..., models/...), so they must run from the repo root.
      # They are expected to live in scripts/ - adjust the paths below if yours are elsewhere.
      - name: Run data update script
        run: python scripts/update_data.py

      - name: Run model retraining
        run: python scripts/retrain_model.py

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          # -f forces the update even if .gitignore tries to block .pkl files
          git add -f data/processed/features_engineered.csv models/*.pkl
          git commit -m "Auto-update: market data and model refreshed" || echo "No changes to commit"
          # Rebase first so a manual push made in the meantime doesn't make the push fail
          git pull --rebase
          git push
